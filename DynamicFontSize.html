<!DOCTYPE html>
<html>

<head>
    <title>Dynamic font size</title>
    <style>
        #pResult {
            background-color: antiquewhite;
            border-radius: 5px;
            border-style: dashed;
            padding: 50px;
            width: 630px;
        }
    </style>
    <script src="Js Files/DynamicFontSize.js" defer></script>
</head>

<body>
    <label>Font Size</label>
    <input id="txtFontSize" type="number"><br>
    <button id="btnIncrease" onclick="onClickDynamicFontSize()">Increase</button>
    <p id="pResult">Lord Kartikeya, also known as Murugan, Subrahmanya, Skanda, and Kumara, is the son of Lord Shiva and
        Goddess Parvati. He is worshipped as the god of war, courage, victory, and wisdom.</p>

</body>

</html>
